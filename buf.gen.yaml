# Generates the blackjack message types (pb2), gRPC stubs (pb2_grpc) and the
# angzarr dispatch wiring (*_angzarr.py) into the package's gitignored _gen/
# tree. Only the example protos are generated (`just proto-gen` passes
# --path): the framework protos (io/angzarr/v1, sererr) come from the
# angzarr-client package (angzarr_client.proto), and the wiring imports the
# router binding as angzarr_client.router — both set by angzarr-client-python's
# codegen templates.
#
# Managed mode only adds a go_package, which the angzarr CLI requires on every
# file; it changes nothing in the Python output.
version: v2
inputs:
  - directory: angzarr-project/proto
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: angzarr.local/gen
plugins:
  - remote: buf.build/protocolbuffers/python:v35.1
    out: src/angzarr_blackjack/_gen
  - remote: buf.build/protocolbuffers/pyi:v35.1
    out: src/angzarr_blackjack/_gen
  - remote: buf.build/grpc/python:v1.76.0
    out: src/angzarr_blackjack/_gen
  - local: ["angzarr", "codegen", "python"]
    out: src/angzarr_blackjack/_gen
    opt:
      - paths=source_relative
      - templates=github.com/angzarr-io/angzarr-client-python@5e373719f6aba8f8d84bc3006de4bcc8075ae72d
    strategy: all
