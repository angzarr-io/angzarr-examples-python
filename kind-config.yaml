kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: angzarr-blackjack
nodes:
  - role: control-plane
    extraPortMappings:
      # Event stream service.
      - containerPort: 31340
        hostPort: 1340
        protocol: TCP
      # PostgreSQL (optional direct access).
      - containerPort: 30432
        hostPort: 5432
        protocol: TCP
      # Aggregate coordinators (debug NodePorts) for the cluster acceptance
      # tier: player and table.
      - containerPort: 31320
        hostPort: 31320
        protocol: TCP
      - containerPort: 31321
        hostPort: 31321
        protocol: TCP
      # LedgerQueryService on the ledger projector.
      - containerPort: 31325
        hostPort: 31325
        protocol: TCP
