kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: poker-ai
nodes:
  - role: control-plane
    extraPortMappings:
      # Gateway for game commands
      - containerPort: 30084
        hostPort: 9084
        protocol: TCP
      # Stream service for events
      - containerPort: 31340
        hostPort: 1340
        protocol: TCP
      # AI Player gRPC service
      - containerPort: 30500
        hostPort: 50500
        protocol: TCP
      # PostgreSQL (optional direct access)
      - containerPort: 30432
        hostPort: 5432
        protocol: TCP
      # Aggregate gRPC (debug NodePorts) — exposed for cluster acceptance
      # tests, which talk directly to the per-domain coordinator.
      - containerPort: 31320
        hostPort: 31320
        protocol: TCP
      - containerPort: 31321
        hostPort: 31321
        protocol: TCP
      - containerPort: 31322
        hostPort: 31322
        protocol: TCP
      - containerPort: 31323
        hostPort: 31323
        protocol: TCP
      - containerPort: 31324
        hostPort: 31324
        protocol: TCP
