# Generates the angzarr-router Python binding's protobuf tree (framework protos
# from this repo's angzarr-project pin, plus the binding's own FFI aux protos)
# into vendor/angzarr-router-ffi. Used by `just vendor-router`.
#
# Same plugin version and no managed mode as buf.gen.yaml, so the framework
# descriptors the binding registers are byte-identical to the ones the
# example's _gen registers.
version: v2
plugins:
  - remote: buf.build/protocolbuffers/python:v35.1
    out: vendor/angzarr-router-ffi/angzarr_router_ffi/gen
