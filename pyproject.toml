[project]
name = "angzarr-poker"
version = "0.1.0"
description = "Poker engine built on angzarr CQRS/ES framework"
requires-python = ">=3.11"
# Dependencies
dependencies = [
    # The FFI router binding the poker components dispatch through. It is not a
    # published package (cdylib packaging deferred); consumed as an editable path
    # source below. Its cdylib is located at runtime via ANGZARR_ROUTER_LIB.
    "angzarr-router-ffi",
    # Must be the 7.x runtime the protocolbuffers/python v35.1 gencode targets
    # (the generated _gen embeds a runtime-version check) and that the FFI binding
    # pins — see proto-gen / framework byte-identity.
    "protobuf>=7.35.1,<8",
    "grpcio>=1.60.0",
    # grpcio-tools removed: codegen is done by buf (remote protocolbuffers/python
    # + grpc/python plugins), not local protoc, and grpcio-tools caps
    # protobuf<7 which conflicts with the v35.1 gencode runtime (protobuf 7.x).
    "grpcio-health-checking>=1.60.0",
    "structlog>=24.0.0",
    "behave>=1.3.3",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "debugpy>=1.8.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.3.0",
    "mutmut>=3.2.0",
    # protoletariat is a gen-time tool only and pins protobuf<6 (incompatible
    # with the v35.1 gencode runtime, protobuf 7.x). Run it isolated via
    # `uvx --from protoletariat protol` in proto-gen rather than as a project dep.
]

[tool.uv.sources]
angzarr-router-ffi = { path = "vendor/angzarr-router-ffi", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/angzarr_poker"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Integration tests need a running container and are opt-in via `just test-integration-ai`
# (which sets -p no:cacheprovider and points pytest at tests/integration/ explicitly).
addopts = "-v --ignore=tests/integration"
markers = [
    "integration: requires a running sidecar container (see tests/integration/)",
]

[tool.black]
target-version = ["py311"]
# Submodules have their own formatting rules + CI.
extend-exclude = '''
(
    angzarr-client-python
    | angzarr-project
    | mutants
)
'''

[tool.mutmut]
paths_to_mutate = [
    "player/agg/handlers.py",
    "table/agg/handlers/table.py",
    "hand/agg/handlers/hand.py",
    "hand/agg/handlers/game_rules.py",
    "tournament/agg/handlers.py",
]
# Copy sibling source files that tests/unit/test_*.py import alongside
# the mutated handlers — without these, mutmut's ``mutants/`` workdir
# can't resolve ``from player.agg.state import ...`` etc. at collection.
also_copy = [
    "player/",
    "table/",
    "hand/",
    "tournament/",
    "tests/",
    "sagas/",
    "hand-flow/",
    "hand-flow-oo/",
    "prj-output/",
    "prj_training/",
    "buy_in/",
    "rebuy/",
    "registration/",
    "reservation/",
    "angzarr-project/",
    # behave --stage unit/acceptance walks up from submodule features to
    # find these; mutmut's mutants/ workdir must contain them or step
    # discovery fails with "No steps directory".
    "unit_steps/",
    "unit_environment.py",
    "acceptance_steps/",
    "acceptance_environment.py",
]
pytest_add_cli_args_test_selection = [
    "--ignore=tests/integration",
]

[tool.ruff]
extend-exclude = ["**/*_pb2.py", "**/*_pb2_grpc.py", "**/angzarr-core", "**/angzarr-core/**"]

[tool.ruff.lint.per-file-ignores]
# These files require sys.path manipulation before imports
"run_game.py" = ["E402"]
"run_whatifs.py" = ["E402"]
"tests/conftest.py" = ["E402"]
