[project]
name = "angzarr-blackjack"
version = "0.1.0"
description = "Blackjack table example built on the angzarr CQRS/ES framework"
requires-python = ">=3.11"
dependencies = [
    # The FFI router binding every component dispatches through. It is not a
    # published package; `just vendor-router` stages it (binding source, its
    # generated framework protos and the cdylib) under vendor/, consumed here as
    # an editable path source. The cdylib is located via ANGZARR_ROUTER_LIB.
    "angzarr-router-ffi",
    # The 7.x runtime the protocolbuffers/python v35.1 gencode targets (the
    # generated _gen embeds a runtime-version check) and the binding pins.
    "protobuf>=7.35.1,<8",
    "grpcio>=1.60.0",
    "grpcio-health-checking>=1.60.0",
    "structlog>=24.0.0",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mutmut>=3.2.0,<3.3",
    # AMQP consumer behind the acceptance harness's EventStreamSubscriber.
    "pika>=1.3.0",
]

[tool.uv.sources]
angzarr-router-ffi = { path = "vendor/angzarr-router-ffi", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/angzarr_blackjack"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
target-version = ["py311"]
extend-exclude = '''
(
    angzarr-project
    | mutants
    | vendor
    | _gen
)
'''

[tool.mutmut]
# Everything under src/ is copied into mutants/; the business logic and the
# hosts are mutated. Generated code, transport (servicers, server) and process
# entrypoints are copied unmutated. The pytest suite — native unit tests plus
# the in-process behave bridge (tests/example/test_features.py) — runs against
# each mutant.
paths_to_mutate = ["src/"]
do_not_mutate = [
    "src/angzarr_blackjack/_gen/*",
    "src/angzarr_blackjack/_runtime/server.py",
    "src/angzarr_blackjack/_runtime/servicers.py",
    "*/main.py",
    "*/__init__.py",
]
# The bridge runs behave over the submodule's features with the unit steps,
# through the staged router binding.
also_copy = [
    "vendor/",
    "unit_steps/",
    "unit_environment.py",
    "angzarr-project/features/",
    "uv.lock",
]

[tool.ruff]
extend-exclude = [
    "**/_gen/**",
    "angzarr-project",
    "vendor",
    "mutants",
]

[tool.ruff.lint.per-file-ignores]
# Behave environments put src/ on sys.path before importing the steps.
"unit_environment.py" = ["E402"]
"acceptance_environment.py" = ["E402"]
