# The repository's tooling environment: the formatter and linter run over the
# player app (player/, its own uv project), and the tests of tools/. Not a
# package: nothing is built or installed from the root.

[project]
name = "angzarr-examples-python-tools"
version = "0.1.0"
description = "Tooling for the angzarr Python examples"
license = "Apache-2.0 OR BSD-3-Clause"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff==0.17.3",
    # tools/mutation_scope.py counts mutants with mutmut's own mutator.
    "mutmut>=3.2.0,<3.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tools"]
addopts = "-q"

[tool.black]
target-version = ["py311"]
extend-exclude = '''
(
    angzarr-project
    | mutants
    | /_gen/
)
'''

[tool.ruff]
extend-exclude = [
    # The player's generated package, every file of which the angzarr CLI
    # rewrites on every scaffold run.
    "**/_gen/**",
    "angzarr-project",
    "mutants",
]

# Complexity gate (architecture-fixes G1): mccabe complexity over 10, and
# pylint's branch, statement and argument counts at ruff's defaults (12, 50
# and 5). No noqa or per-file escapes; a violator is refactored.
[tool.ruff.lint]
extend-select = ["C901", "PLR0912", "PLR0915", "PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 10
