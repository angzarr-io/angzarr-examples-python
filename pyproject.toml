[project]
name = "angzarr-blackjack"
version = "0.1.0"
description = "Blackjack table example built on the angzarr CQRS/ES framework"
requires-python = ">=3.11"
dependencies = [
    # The router binding (angzarr_client.router), the framework protos
    # (angzarr_client.proto), the component host and the codegen templates.
    # Not released yet: pinned to a commit; installing it builds its protos
    # and router library (needs cargo).
    "angzarr-client",
    # The 7.x runtime the protocolbuffers/python v35.1 gencode targets.
    "protobuf>=7.35.1,<8",
    # grpc/python v1.76.0 gencode checks the runtime is at least that version.
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "structlog>=24.0.0",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mutmut>=3.2.0,<3.3",
    # AMQP consumer behind the acceptance harness's EventStreamSubscriber.
    "pika>=1.3.0",
]

[tool.uv.sources]
angzarr-client = { git = "https://github.com/angzarr-io/angzarr-client-python", rev = "218413414e69d646839ccaf0b254251dd2813ff1" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/angzarr_blackjack"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
target-version = ["py311"]
extend-exclude = '''
(
    angzarr-project
    | mutants
    | \.deps
    | _gen
)
'''

[tool.mutmut]
# Everything under src/ is copied into mutants/; the business logic and the
# hosts are mutated. Generated code, transport (servicers, server) and process
# entrypoints are copied unmutated. The pytest suite — native unit tests plus
# the in-process behave bridge (tests/example/test_features.py) — runs against
# each mutant.
paths_to_mutate = ["src/"]
do_not_mutate = [
    "src/angzarr_blackjack/_gen/*",
    "*/main.py",
    "*/__init__.py",
]
# The bridge runs behave over the submodule's features with the unit steps,
# through the staged router binding.
also_copy = [
    "unit_steps/",
    "unit_environment.py",
    "angzarr-project/features/",
    "uv.lock",
]

[tool.ruff]
extend-exclude = [
    "**/_gen/**",
    "angzarr-project",
    ".deps",
    "mutants",
]

[tool.ruff.lint.per-file-ignores]
# Behave environments put src/ on sys.path before importing the steps.
"unit_environment.py" = ["E402"]
"acceptance_environment.py" = ["E402"]
