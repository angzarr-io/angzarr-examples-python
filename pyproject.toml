# The repository's tooling environment: the formatter and linter run over the
# player app (player/, its own uv project), and the tests of tools/. Not a
# package: nothing is built or installed from the root.

[project]
name = "angzarr-examples-python-tools"
version = "0.1.0"
description = "Tooling for the angzarr Python examples"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    # tools/mutation_scope.py counts mutants with mutmut's own mutator.
    "mutmut>=3.2.0,<3.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tools"]
addopts = "-q"

[tool.black]
target-version = ["py311"]
extend-exclude = '''
(
    angzarr-project
    | mutants
    | _gen
    | player/src/angzarr_player/(domain|logic|main|__main__|_descriptor|_version)\.py
)
'''

[tool.ruff]
extend-exclude = [
    "**/_gen/**",
    # The player's files the angzarr CLI rewrites on every scaffold run.
    "player/src/angzarr_player/domain.py",
    "player/src/angzarr_player/logic.py",
    "player/src/angzarr_player/main.py",
    "player/src/angzarr_player/__main__.py",
    "player/src/angzarr_player/_descriptor.py",
    "player/src/angzarr_player/_version.py",
    "angzarr-project",
    "mutants",
]
