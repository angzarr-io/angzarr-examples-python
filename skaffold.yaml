apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: blackjack-python

# Builds the component images (content-addressed tags, so kind never
# serves a stale image) and deploys them with the angzarr chart. The chart
# path is the local core checkout's chart; override with
# `skaffold run --set ...` or ANGZARR_CHART in the justfile.
build:
  tagPolicy:
    gitCommit:
      prefix: "dev-"
      variant: AbbrevCommitSha
  local:
    push: false
    useBuildkit: true
    concurrency: 2
  artifacts:
    - image: ghcr.io/angzarr-io/examples-python-agg-table
      docker: {dockerfile: Containerfile, target: agg-table}

deploy:
  helm:
    releases:
      - name: blackjack
        chartPath: ../../core/main/deploy/k8s/helm/angzarr
        namespace: angzarr
        createNamespace: true
        valuesFiles:
          - values.yaml
        # Credentials come from the in-cluster Secret angzarr-credentials;
        # `just up` exports them as ANGZARR_DB_PASSWORD / ANGZARR_MQ_PASSWORD.
        # Helm replaces a list given on the command line wholesale, so each
        # application entry is set in full here, with the image skaffold built.
        setValueTemplates:
          storage.postgres.password: "{{.ANGZARR_DB_PASSWORD}}"
          storage.postgres.uri: "postgres://angzarr:{{.ANGZARR_DB_PASSWORD}}@angzarr-db:5432/angzarr"
          messaging.amqp.url: "amqp://angzarr:{{.ANGZARR_MQ_PASSWORD}}@angzarr-mq:5672/%2F"
          # Dead letters go to the bus (exchange angzarr.dlq).
          config.dlq.targets[0].type: "amqp"
          config.dlq.targets[0].amqp.url: "amqp://angzarr:{{.ANGZARR_MQ_PASSWORD}}@angzarr-mq:5672/%2F"
          applications.business[0].name: "agg-table"
          applications.business[0].domain: "table"
          applications.business[0].port: "50402"
          applications.business[0].debug.enabled: "true"
          applications.business[0].debug.nodePort: "31321"
          applications.business[0].snapshotEvery: "20"
          applications.business[0].image.repository: "{{.IMAGE_REPO_ghcr_io_angzarr_io_examples_python_agg_table}}"
          applications.business[0].image.tag: "{{.IMAGE_TAG_ghcr_io_angzarr_io_examples_python_agg_table}}"
          applications.business[0].image.pullPolicy: "IfNotPresent"

profiles:
  # Deploying against coordinators built from a core checkout
  # (`just deploy-apps-local`): the chart comes from ANGZARR_CORE_SRC and the
  # four coordinator images carry the tags that core's own
  # skaffold build gave them (ANGZARR_<COORDINATOR>_TAG, already loaded into
  # kind).
  - name: local-core
    patches:
      - op: replace
        path: /deploy/helm/releases/0/chartPath
        value: "{{.ANGZARR_CORE_SRC}}/deploy/k8s/helm/angzarr"
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/images.aggregate.tag
        value: "{{.ANGZARR_AGGREGATE_TAG}}"
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/images.saga.tag
        value: "{{.ANGZARR_SAGA_TAG}}"
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/images.projector.tag
        value: "{{.ANGZARR_PROJECTOR_TAG}}"
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/images.processManager.tag
        value: "{{.ANGZARR_PROCESS_MANAGER_TAG}}"

  # CI deploys with the published chart instead of a local core checkout.
  - name: ci
    deploy:
      helm:
        releases:
          - name: blackjack
            remoteChart: oci://ghcr.io/angzarr-io/charts/angzarr
            version: 0.5.1
            namespace: angzarr
            createNamespace: true
            valuesFiles:
              - values.yaml
            # Credentials come from the in-cluster Secret angzarr-credentials;
            # `just up` exports them as ANGZARR_DB_PASSWORD / ANGZARR_MQ_PASSWORD.
            # Helm replaces a list given on the command line wholesale, so each
            # application entry is set in full here, with the image skaffold built.
            setValueTemplates:
              storage.postgres.password: "{{.ANGZARR_DB_PASSWORD}}"
              storage.postgres.uri: "postgres://angzarr:{{.ANGZARR_DB_PASSWORD}}@angzarr-db:5432/angzarr"
              messaging.amqp.url: "amqp://angzarr:{{.ANGZARR_MQ_PASSWORD}}@angzarr-mq:5672/%2F"
              # Dead letters go to the bus (exchange angzarr.dlq).
              config.dlq.targets[0].type: "amqp"
              config.dlq.targets[0].amqp.url: "amqp://angzarr:{{.ANGZARR_MQ_PASSWORD}}@angzarr-mq:5672/%2F"
              applications.business[0].name: "agg-table"
              applications.business[0].domain: "table"
              applications.business[0].port: "50402"
              applications.business[0].debug.enabled: "true"
              applications.business[0].debug.nodePort: "31321"
              applications.business[0].snapshotEvery: "20"
              applications.business[0].image.repository: "{{.IMAGE_REPO_ghcr_io_angzarr_io_examples_python_agg_table}}"
              applications.business[0].image.tag: "{{.IMAGE_TAG_ghcr_io_angzarr_io_examples_python_agg_table}}"
              applications.business[0].image.pullPolicy: "IfNotPresent"
