# The player domain (io.angzarr.examples.v1.PlayerState), served to
# angzarr-embedded as a child process. Written once by `angzarr scaffold
# python` and yours from then on.

[project]
name = "angzarr-player"
version = "0.1.0"
description = "The player domain, an angzarr-embedded child process"
license = "Apache-2.0 OR BSD-3-Clause"
requires-python = ">=3.11"
dependencies = [
    "angzarr-client",
    "protobuf>=7.35.1,<8",
    "grpcio>=1.84.1",
    "grpcio-health-checking>=1.76.0",
    "structlog>=24",
]

[project.scripts]
angzarr-player = "angzarr_player.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<9.2", "pytest-timeout>=2.3", "mutmut>=3.2.0,<3.3"]

[tool.uv.sources]
# The angzarr Python package at the commit this angzarr CLI was built against
# (dbec93f: a process manager's compensation tooling, decision 14.74).
angzarr-client = { git = "https://github.com/angzarr-io/angzarr-client-python", rev = "dbec93ff2036f2fbcb37d1582f08d83977276622" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/angzarr_player"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"
timeout = 60

[tool.mutmut]
# The player's own code is mutated: its logic (logic_impl.py), its strategy
# and its composition root (__main__.py). Everything the angzarr CLI's
# scaffold rewrites is under _gen, copied unmutated, as the root app leaves
# its generated code; it is the CLI's to test. Run from player/ (`just
# mutation-test`), killed by its pytest suite.
paths_to_mutate = ["src/"]
do_not_mutate = [
    "src/angzarr_player/_gen/*",
    "*/__init__.py",
]
