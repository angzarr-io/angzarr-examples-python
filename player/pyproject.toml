# The player domain (io.angzarr.examples.v1.PlayerState), served to
# angzarr-embedded as a child process. Written once by `angzarr scaffold
# python` and yours from then on.

[project]
name = "angzarr-player"
version = "0.1.0"
description = "The player domain, an angzarr-embedded child process"
requires-python = ">=3.11"
dependencies = [
    "angzarr-client",
    "protobuf>=7.35.1,<8",
    "grpcio>=1.84.1",
    "grpcio-health-checking>=1.76.0",
    "structlog>=24",
]

[project.scripts]
angzarr-player = "angzarr_player.main:main"

[dependency-groups]
dev = ["pytest>=8,<9.2", "pytest-timeout>=2.3", "mutmut>=3.2.0,<3.3"]

[tool.uv.sources]
# The angzarr Python package at the commit this angzarr CLI was built against.
angzarr-client = { git = "https://github.com/angzarr-io/angzarr-client-python", rev = "95c8c0cafd66984490a075359239dee77f094be0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/angzarr_player"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"
timeout = 60

[tool.mutmut]
# The player's own code is mutated: its logic and its strategy. The files the
# angzarr CLI's scaffold writes (domain.py, logic.py, main.py, __main__.py,
# _descriptor.py, _version.py and the dispatch under _gen) are copied
# unmutated, as the root app leaves its generated code; they are the CLI's to
# test. Run from player/ (`just mutation-test`), killed by its pytest suite.
paths_to_mutate = ["src/"]
do_not_mutate = [
    "src/angzarr_player/_gen/*",
    "src/angzarr_player/domain.py",
    "src/angzarr_player/logic.py",
    "src/angzarr_player/main.py",
    "src/angzarr_player/__main__.py",
    "src/angzarr_player/_descriptor.py",
    "src/angzarr_player/_version.py",
    "*/__init__.py",
]
