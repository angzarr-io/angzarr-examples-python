# CI-specific overrides for Helm deployment
# Used in addition to values.yaml when deploying in CI

# Image pull secret for GHCR
imagePullSecrets:
  - name: ghcr-pull-secret

# Init containers use host/port for health checks (nc -z)
# Service names match Helm release names (postgres-simple/rabbitmq-simple use .Release.Name)
storage:
  postgres:
    uri: "postgres://angzarr:angzarr@angzarr-db:5432/angzarr"
    host: "angzarr-db"
    port: 5432

messaging:
  amqp:
    url: "amqp://angzarr:angzarr@angzarr-mq:5672/%2F"
    host: "angzarr-mq"
    port: 5672

# Use IfNotPresent since images are pre-loaded into Kind
applications:
  business:
    - name: poker-player
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-player
        tag: "latest"
        pullPolicy: IfNotPresent
      domain: "player"
      port: 50301

    - name: poker-table
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-table
        tag: "latest"
        pullPolicy: IfNotPresent
      domain: "table"
      port: 50302

    - name: poker-hand
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-hand
        tag: "latest"
        pullPolicy: IfNotPresent
      domain: "hand"
      port: 50303

    - name: poker-tournament
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-tournament
        tag: "latest"
        pullPolicy: IfNotPresent
      domain: "tournament"
      port: 50304

    - name: poker-reservation
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-reservation
        tag: "latest"
        pullPolicy: IfNotPresent
      domain: "reservation"
      port: 50305

  sagas:
    - name: saga-table-hand
      image:
        repository: ghcr.io/angzarr-io/examples-python-saga-table-hand
        tag: "latest"
        pullPolicy: IfNotPresent
      domain: "saga-table-hand"
      port: 50411
      topics:
        - "table"
    - name: saga-table-player
      image:
        repository: ghcr.io/angzarr-io/examples-python-saga-table-player
        tag: "latest"
        pullPolicy: IfNotPresent
      domain: "saga-table-player"
      port: 50413
      topics:
        - "table"
    - name: saga-hand-table
      image:
        repository: ghcr.io/angzarr-io/examples-python-saga-hand-table
        tag: "latest"
        pullPolicy: IfNotPresent
      domain: "saga-hand-table"
      port: 50412
      topics:
        - "hand"
    - name: saga-hand-player
      image:
        repository: ghcr.io/angzarr-io/examples-python-saga-hand-player
        tag: "latest"
        pullPolicy: IfNotPresent
      domain: "saga-hand-player"
      port: 50414
      topics:
        - "hand"

  processManagers:
    - name: pmg-reservation
      image:
        repository: ghcr.io/angzarr-io/examples-python-pmg-reservation
        tag: "latest"
        pullPolicy: IfNotPresent
      domain: "pmg-reservation"
      port: 50395
      topics:
        - "reservation"
        - "table"
        - "tournament"

  projectors:
    - name: prj-training
      image:
        repository: ghcr.io/angzarr-io/examples-python-prj-training
        tag: "latest"
        pullPolicy: IfNotPresent
      domain: "hand"
      port: 50491
      topics:
        - "hand"
