# Manually-managed deployment for saga-tournament-table.
#
# The helm chart in core/main/deploy/k8s/helm/angzarr drives the four
# pre-existing sagas via skaffold's setValues block. saga-tournament-table
# is a new entry that landed after the chart values were last templated;
# applying this manifest directly keeps the EA-0012 cluster scenario
# unblocked while the chart's saga values list catches up.
#
# Mirrors the saga-table-hand template structure (poker-side servicer +
# angzarr sidecar). Source domain is ``tournament``; target is ``table``.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saga-tournament-table-saga
  namespace: angzarr
  labels:
    app.kubernetes.io/component: saga
    app.kubernetes.io/instance: poker
    app.kubernetes.io/name: angzarr
spec:
  replicas: 1
  selector:
    matchLabels:
      angzarr.io/saga: saga-tournament-table
      app.kubernetes.io/component: saga
      app.kubernetes.io/instance: poker
      app.kubernetes.io/name: angzarr
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        angzarr.io/saga: saga-tournament-table
        app.kubernetes.io/component: saga
        app.kubernetes.io/instance: poker
        app.kubernetes.io/name: angzarr
    spec:
      serviceAccount: poker-angzarr
      serviceAccountName: poker-angzarr
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for RabbitMQ..."
              until nc -z angzarr-mq 5672 2>/dev/null; do sleep 2; done
              echo "RabbitMQ is ready"
      containers:
        - name: saga-tournament-table
          image: ghcr.io/angzarr-io/poker-python-saga-tournament-table:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50415
              protocol: TCP
          env:
            - name: PORT
              value: "50415"
            - name: ANGZARR_HOST
              value: localhost
            - name: ANGZARR_PORT
              value: "1310"
            - name: MESSAGING_TYPE
              value: amqp
            - name: MESSAGING_AMQP_URL
              value: amqp://angzarr:KkfrcFQrGn8ZYWeSUgSm1Vun2x52VZQP@angzarr-mq:5672/%2F
            - name: EVENT_TOPICS
              value: tournament
            - name: ANGZARR_LOG
              value: info
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
        - name: angzarr
          image: ghcr.io/angzarr-io/angzarr-saga:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: aggregate
              containerPort: 1310
              protocol: TCP
            - name: query
              containerPort: 1315
              protocol: TCP
          env:
            - name: ANGZARR_LOG
              value: info
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ANGZARR__SERVER__HOST
              value: 0.0.0.0
            - name: ANGZARR__SERVER__AGGREGATE_PORT
              value: "1310"
            - name: ANGZARR__SERVER__EVENT_QUERY_PORT
              value: "1315"
            - name: ANGZARR__TARGET__ADDRESS
              value: localhost:50415
            - name: ANGZARR__TARGET__DOMAIN
              value: saga-tournament-table
            - name: ANGZARR_STATIC_ENDPOINTS
              value: player=player-aggregate:1310,table=table-aggregate:1310,hand=hand-aggregate:1310,tournament=tournament-aggregate:1310,reservation=reservation-aggregate:1310
            - name: ANGZARR__STORAGE__TYPE
              value: postgres
            - name: ANGZARR__STORAGE__POSTGRES__URI
              value: postgres://angzarr:g3QVgk2am039FkvRX1bi9wzDQXdC7QXV@angzarr-db:5432/angzarr
            - name: ANGZARR__MESSAGING__TYPE
              value: amqp
            - name: ANGZARR__MESSAGING__AMQP__URL
              value: amqp://angzarr:KkfrcFQrGn8ZYWeSUgSm1Vun2x52VZQP@angzarr-mq:5672/%2F
            - name: ANGZARR__MESSAGING__AMQP__DOMAIN
              value: tournament
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: saga-tournament-table-saga
  namespace: angzarr
  labels:
    app.kubernetes.io/component: saga
    app.kubernetes.io/instance: poker
    app.kubernetes.io/name: angzarr
spec:
  type: ClusterIP
  selector:
    angzarr.io/saga: saga-tournament-table
    app.kubernetes.io/component: saga
    app.kubernetes.io/instance: poker
    app.kubernetes.io/name: angzarr
  ports:
    - name: aggregate
      port: 1310
      targetPort: aggregate
      protocol: TCP
    - name: query
      port: 1315
      targetPort: query
      protocol: TCP
