name: Mutation

# Mutation testing runs on a schedule against main (a quality gate on the
# integrated branch), not per pull request.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  ANGZARR_CLI_REF: rem/review-2026-09
  ANGZARR_ROUTER_REF: rem/review-2026-09
  ANGZARR_CLI_SRC: .deps/angzarr-cli
  ANGZARR_ROUTER_SRC: .deps/angzarr-router

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: angzarr-io/angzarr-cli
          ref: ${{ env.ANGZARR_CLI_REF }}
          path: .deps/angzarr-cli
      - uses: actions/checkout@v4
        with:
          repository: angzarr-io/angzarr-router
          ref: ${{ env.ANGZARR_ROUTER_REF }}
          path: .deps/angzarr-router
      - uses: extractions/setup-just@v2
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - run: just -f justfile.container ci-setup
      - run: just -f justfile.container mutation-test
