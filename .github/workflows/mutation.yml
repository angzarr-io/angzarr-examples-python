name: Mutation

# Mutation testing runs on a schedule against main (a quality gate on the
# integrated branch), not per pull request.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  # The player app (player/, its own uv project): every mutant of its own
  # code, gated at 90% (player/justfile `mutation-test`).
  player-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v6
      - run: just --justfile player/justfile install
      - run: just --justfile player/justfile mutation-test
