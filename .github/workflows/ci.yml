name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Unbypassable guard against `--no-verify`: submodule working trees are clean.
  submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: extractions/setup-just@v2
      - run: just check-submodules-clean

  # The root's tooling: lint and the format check over the player, and the
  # tests of tools/ (justfile.container).
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [submodules]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v6
      - run: just -f justfile.container install
      - run: just -f justfile.container ci-test

  # The player app (player/, its own uv project on the native router): its
  # locked environment and its tests (player/justfile).
  player-test:
    name: Player test
    runs-on: ubuntu-latest
    needs: [submodules]
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v6
      - run: just --justfile player/justfile install
      - run: just --justfile player/justfile test
