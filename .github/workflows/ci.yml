name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

env:
  # The angzarr CLI (codegen plugin) is built from source at this ref;
  # angzarr-client-python is checked out and built by `just client-setup`
  # at the revision justfile.container pins.
  ANGZARR_CLI_REF: 734b1bbdd4e913f19f8cb87f3f1dd95c06053d99
  ANGZARR_CLI_SRC: .deps/angzarr-cli
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Unbypassable guard against `--no-verify`: submodule working trees are clean.
  submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: extractions/setup-just@v2
      - run: just check-submodules-clean

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [submodules]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: angzarr-io/angzarr-cli
          ref: ${{ env.ANGZARR_CLI_REF }}
          path: .deps/angzarr-cli
      - uses: extractions/setup-just@v2
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - run: just -f justfile.container ci-system-deps
      - run: just -f justfile.container ci-setup
      - run: just -f justfile.container ci-test

  images:
    name: Images
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: angzarr-io/angzarr-cli
          ref: ${{ env.ANGZARR_CLI_REF }}
          path: .deps/angzarr-cli
      - uses: extractions/setup-just@v2
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - uses: yokawasa/action-setup-kube-tools@v0.11.2
        with:
          setup-tools: skaffold
          # skaffold.yaml uses apiVersion skaffold/v4beta11 (skaffold >= 2.10).
          skaffold: 2.17.0
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: just -f justfile.container ci-system-deps
      - run: just -f justfile.container ci-setup
      - run: just ci-images
        env:
          SKAFFOLD_PUSH: ${{ github.event_name != 'pull_request' }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build.json

  acceptance:
    name: Acceptance
    runs-on: ubuntu-latest
    needs: [test]
    # Remove once core publishes io.angzarr.v1 coordinator images and the bumper pins their digests.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: angzarr-io/angzarr-cli
          ref: ${{ env.ANGZARR_CLI_REF }}
          path: .deps/angzarr-cli
      - uses: extractions/setup-just@v2
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - uses: yokawasa/action-setup-kube-tools@v0.11.2
        with:
          setup-tools: |
            skaffold
            helm
          skaffold: 2.17.0
          helm: 3.20.1
      - run: just -f justfile.container ci-system-deps
      - run: just -f justfile.container ci-setup
      - run: just ci-acceptance
