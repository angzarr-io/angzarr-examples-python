name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

env:
  # The angzarr CLI (codegen plugin) and angzarr-router (Python binding +
  # cdylib) are built from source at these refs.
  ANGZARR_CLI_REF: rem/review-2026-09
  ANGZARR_ROUTER_REF: rem/review-2026-09
  ANGZARR_CLI_SRC: .deps/angzarr-cli
  ANGZARR_ROUTER_SRC: .deps/angzarr-router
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Unbypassable guard against `--no-verify`: submodule working trees are clean.
  submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: extractions/setup-just@v2
      - run: just check-submodules-clean

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [submodules]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: angzarr-io/angzarr-cli
          ref: ${{ env.ANGZARR_CLI_REF }}
          path: .deps/angzarr-cli
      - uses: actions/checkout@v4
        with:
          repository: angzarr-io/angzarr-router
          ref: ${{ env.ANGZARR_ROUTER_REF }}
          path: .deps/angzarr-router
          submodules: true
      - uses: extractions/setup-just@v2
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - run: just -f justfile.container ci-system-deps
      - run: just -f justfile.container ci-setup
      - run: just -f justfile.container ci-test

  images:
    name: Images
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: angzarr-io/angzarr-cli
          ref: ${{ env.ANGZARR_CLI_REF }}
          path: .deps/angzarr-cli
      - uses: actions/checkout@v4
        with:
          repository: angzarr-io/angzarr-router
          ref: ${{ env.ANGZARR_ROUTER_REF }}
          path: .deps/angzarr-router
          submodules: true
      - uses: extractions/setup-just@v2
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - uses: yokawasa/action-setup-kube-tools@v0.11.2
        with:
          setup-tools: skaffold
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: just -f justfile.container ci-system-deps
      - run: just -f justfile.container ci-setup
      - run: just ci-images
        env:
          SKAFFOLD_PUSH: ${{ github.event_name != 'pull_request' }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build.json

  acceptance:
    name: Acceptance
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: angzarr-io/angzarr-cli
          ref: ${{ env.ANGZARR_CLI_REF }}
          path: .deps/angzarr-cli
      - uses: actions/checkout@v4
        with:
          repository: angzarr-io/angzarr-router
          ref: ${{ env.ANGZARR_ROUTER_REF }}
          path: .deps/angzarr-router
          submodules: true
      - uses: extractions/setup-just@v2
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - uses: yokawasa/action-setup-kube-tools@v0.11.2
        with:
          setup-tools: |
            skaffold
            helm
      - run: just -f justfile.container ci-system-deps
      - run: just -f justfile.container ci-setup
      - run: just ci-acceptance
