name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  UV_VERSION: "0.10.3"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/angzarr-io/examples-python
  # Coordinator version for acceptance tests
  COORDINATOR_VERSION: latest
  # Opt into Node.js 24 for GitHub Actions (required after June 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/angzarr-io/angzarr-python:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Use container justfile
        run: cp justfile.container justfile

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Generate protos for angzarr-client-python
        run: |
          cd angzarr-client-python
          buf generate
          python scripts/generate_protos.py

      - name: Update uv
        run: |
          curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: just install

      - name: Test (unit)
        run: just test-unit

      - name: Lint
        run: just lint

      - name: Format check
        run: just fmt --check

  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target:
          - agg-player
          - agg-table
          - agg-hand
          - prj-training
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Generate protos
        run: |
          buf generate
          cd angzarr-client-python
          buf generate
          python scripts/generate_protos.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            echo "tags=${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:pr-${PR_NUM}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:${SHORT_SHA},${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image for acceptance tests
        if: github.event_name == 'pull_request'
        run: docker save -o /tmp/${{ matrix.target }}.tar "${{ steps.tags.outputs.tags }}"

      - name: Upload image artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.target }}
          path: /tmp/${{ matrix.target }}.tar
          retention-days: 1

  acceptance-test:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: build-images
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate image tag
        id: tag
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            echo "tag=pr-${PR_NUM}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          else
            echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Install tools
        run: |
          # Install just
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: uv sync

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: angzarr-test
          config: deploy/kind/cluster.yaml
          node_image: kindest/node:v1.31.0
          wait: 120s

      - name: Create namespace
        run: kubectl create namespace angzarr-test --dry-run=client -o yaml | kubectl apply -f -

      - name: Create image pull secret
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --namespace=angzarr-test \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch serviceaccount default -n angzarr-test \
            -p '{"imagePullSecrets": [{"name": "ghcr-pull-secret"}]}' || true

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Helm registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull and load coordinator images
        run: |
          VERSION="${{ env.COORDINATOR_VERSION }}"
          COORDINATORS=(
            "angzarr-aggregate"
            "angzarr-saga"
            "angzarr-projector"
            "angzarr-process-manager"
            "angzarr-stream"
            "angzarr-grpc-gateway"
            "angzarr-log"
          )
          for name in "${COORDINATORS[@]}"; do
            img="ghcr.io/angzarr-io/${name}:${VERSION}"
            echo "Pulling $img..."
            docker pull "$img"
            kind load docker-image "$img" --name angzarr-test
          done

      - name: Download image artifacts
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          path: /tmp/images
          pattern: image-*

      - name: Load example images into Kind (PR)
        if: github.event_name == 'pull_request'
        run: |
          for tarball in /tmp/images/image-*/*.tar; do
            echo "Loading $tarball..."
            kind load image-archive "$tarball" --name angzarr-test
          done

      - name: Pull and load example images (push)
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          TARGETS=(agg-player agg-table agg-hand prj-training)
          for target in "${TARGETS[@]}"; do
            img="${{ env.IMAGE_PREFIX }}-${target}:${TAG}"
            echo "Pulling $img..."
            docker pull "$img"
            kind load docker-image "$img" --name angzarr-test
          done

      - name: Deploy infrastructure
        run: |
          echo "=== Deploying PostgreSQL ==="
          helm upgrade --install angzarr-db \
            oci://ghcr.io/angzarr-io/charts/angzarr-db-postgres-simple \
            --namespace angzarr-test \
            --wait --timeout 2m

          echo "=== Deploying RabbitMQ ==="
          helm upgrade --install angzarr-mq \
            oci://ghcr.io/angzarr-io/charts/angzarr-mq-rabbitmq-simple \
            --namespace angzarr-test \
            --wait --timeout 3m

      - name: Create gateway descriptor configmap
        run: |
          # Generate protobuf descriptor set for the gRPC gateway
          # The gateway uses this to transcode HTTP/JSON to gRPC
          cd angzarr-project/proto
          buf build -o /tmp/types.bin
          cd ../..
          kubectl create configmap gateway-descriptor \
            --from-file=types.bin=/tmp/types.bin \
            --namespace angzarr-test

      - name: Deploy applications
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          helm upgrade --install poker \
            oci://ghcr.io/angzarr-io/charts/angzarr \
            --version 0.5.1 \
            -f values.yaml \
            -f deploy/k8s/helm/values-ci.yaml \
            --set "applications.business[0].image.tag=${TAG}" \
            --set "applications.business[1].image.tag=${TAG}" \
            --set "applications.business[2].image.tag=${TAG}" \
            --set "applications.projectors[0].image.tag=${TAG}" \
            --namespace angzarr-test \
            --wait --timeout 5m

      - name: Wait for pods to be ready
        run: |
          echo "Waiting for all pods to be ready..."
          kubectl wait --for=condition=ready pod --all \
            -n angzarr-test --timeout=120s || true
          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n angzarr-test -o wide

      - name: Run smoke tests
        run: |
          # Smoke test: verify all pods are running and services are healthy
          echo "=== Verifying all pods are ready ==="
          kubectl wait --for=condition=ready pod --all \
            -n angzarr-test --timeout=30s

          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n angzarr-test

          echo ""
          echo "=== Smoke Test: Gateway Reachable ==="
          # Gateway is gRPC-only; verify the port is open via NodePort
          nc -z localhost 9084 && echo "Gateway port 9084 OK" || {
            echo "ERROR: Gateway port 9084 not reachable"
            exit 1
          }

      - name: Generate protos for acceptance tests
        run: |
          cd angzarr-client-python
          buf generate
          python scripts/generate_protos.py

      - name: Run acceptance tests
        run: |
          # Wait for player aggregate pod to be ready
          echo "Waiting for player aggregate pod..."
          kubectl wait --for=condition=ready pod -l angzarr.io/domain=player \
            -n angzarr-test --timeout=180s || {
            echo "Player aggregate pod not ready, checking status..."
            kubectl get pods -n angzarr-test
            exit 1
          }

          # Port-forward player aggregate coordinator for tests
          kubectl port-forward -n angzarr-test svc/player-aggregate 1310:1310 &
          PF_PID=$!
          trap "kill $PF_PID 2>/dev/null || true" EXIT

          # Wait for port-forward to establish
          for i in $(seq 1 10); do
            if nc -z localhost 1310 2>/dev/null; then
              echo "Port-forward to player-aggregate:1310 established"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "WARNING: Port-forward may not be ready, proceeding anyway..."
            fi
            sleep 1
          done

          # Run acceptance tests
          PLAYER_URL=localhost:1310 \
            uv run python -m pytest tests/acceptance/ -v --timeout=600

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n angzarr-test -o wide
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n angzarr-test --sort-by='.lastTimestamp' | tail -30
          echo ""
          echo "=== Pod Logs ==="
          for pod in $(kubectl get pods -n angzarr-test -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs $pod -n angzarr-test --all-containers --tail=50 || true
          done

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [test, build-images, acceptance-test]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Images | ${{ needs.build-images.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Acceptance Tests | ${{ needs.acceptance-test.result }} |" >> $GITHUB_STEP_SUMMARY

          # All jobs must pass to merge
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build-images.result }}" != "success" ] || \
             [ "${{ needs.acceptance-test.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
