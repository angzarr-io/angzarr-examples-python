# Lefthook configuration
# https://github.com/evilmartians/lefthook
#
# Setup: lefthook install (again after a hook is added or removed here: pre-push was)

post-checkout:
  commands:
    install-submodule-hooks:
      run: just install-submodule-hooks

post-merge:
  commands:
    install-submodule-hooks:
      run: just install-submodule-hooks

pre-commit:
  parallel: false
  commands:
    # git exports GIT_DIR/GIT_INDEX_FILE (absolute, pointing at the parent
    # repository) to hooks run from a linked worktree; inherited by the
    # recipe's `git -C <submodule> status`, they would diff the submodule's
    # files against the parent's index. Clearing them scopes each git call to
    # the repository its -C path names.
    check-submodules-clean:
      run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE just check-submodules-clean
    fmt:
      run: just fmt-fix
      stage_fixed: true
    scan-secrets:
      run: just scan-secrets
    # Red tests pass off the default branch, with a warning, and fail on it
    # (each `test-commit` says how). The root's tests (the tooling's, in the
    # dev container):
    test:
      run: just test-commit
    # The player app (player/, a uv project run on the host):
    player-test:
      run: just --justfile player/justfile test-commit

# A merge commit is tested as a commit is, and red tests fail it.
pre-merge-commit:
  commands:
    test:
      run: just test-commit merging
    player-test:
      run: just --justfile player/justfile test-commit merging

# No mutation testing in any hook: it runs while tests are written and judged
# (`just --justfile player/justfile mutation-test <changed paths>`, by hand),
# at the end of an unattended run,
# and in the scheduled CI full pass (.github/workflows/mutation.yml).

# Red tests never reach the default branch: `just push-check` runs every test
# (the root's and the player's) in each pushed commit's own tree (the
# justfile says how), refusing a push to the default branch whose tests fail
# and warning on any other branch. git's pushed refs are on stdin, and {1} is
# the remote's name. lefthook skips a pre-push command when it finds no files
# changed between HEAD and the remote, which says nothing of the refs pushed;
# a `{files}` in `run` turns that off, so `files` names one that is always
# there, and push-check ignores it.
pre-push:
  commands:
    push-check:
      use_stdin: true
      files: echo justfile
      run: just push-check {1} {files}
