# Lefthook configuration
# https://github.com/evilmartians/lefthook
#
# Setup: lefthook install

post-checkout:
  commands:
    install-submodule-hooks:
      run: just install-submodule-hooks

post-merge:
  commands:
    install-submodule-hooks:
      run: just install-submodule-hooks

pre-commit:
  parallel: false
  commands:
    # git exports GIT_DIR/GIT_INDEX_FILE (absolute, pointing at the parent
    # repository) to hooks run from a linked worktree; inherited by the
    # recipe's `git -C <submodule> status`, they would diff the submodule's
    # files against the parent's index. Clearing them scopes each git call to
    # the repository its -C path names.
    check-submodules-clean:
      run: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE just check-submodules-clean
    fmt:
      run: just fmt-fix
      stage_fixed: true
    archlint:
      glob: "{*.py,pyproject.toml,.importlinter,.importlinter-external}"
      run: just archlint
    scan-secrets:
      run: just scan-secrets
    # Native unit tests and the in-process scenario tier.
    test:
      run: just test
    # The player app (player/, a uv project run on the host). Red tests pass
    # off the default branch, with a warning (`test-commit` says how).
    player-test:
      run: just --justfile player/justfile test-commit

# A merge commit is tested as a commit is, and red player tests fail it.
pre-merge-commit:
  commands:
    player-test:
      run: just --justfile player/justfile test-commit merging

pre-push:
  parallel: false
  commands:
    # Gate the mutation kill rate (90%).
    mutation:
      tags: slow
      run: just mutation-test
    # The player's mutants, over the modules the push changes (player/justfile).
    player-mutation:
      glob: "player/src/**/*.py"
      run: just --justfile player/justfile mutation-test {push_files}
