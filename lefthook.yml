# Lefthook configuration
# https://github.com/evilmartians/lefthook
#
# Setup: lefthook install
# Bypass: git commit --no-verify (or LEFTHOOK=0 git commit)

post-checkout:
  commands:
    install-submodule-hooks:
      run: just install-submodule-hooks

post-merge:
  commands:
    install-submodule-hooks:
      run: just install-submodule-hooks

pre-commit:
  parallel: false
  commands:
    check-submodules-clean:
      run: just check-submodules-clean
    fmt:
      run: just fmt-fix
      stage_fixed: true
    # The unit test tier is behave (gherkin), driven through the in-process FFI
    # router. There is no pytest tier in this example, so the gate is the behave
    # unit suite over the poker + framework feature sets.
    test:
      run: just test-example-unit

pre-push:
  parallel: false
  commands:
    # Gate the mutation kill rate. ~4–5 min; bypass with LEFTHOOK=0 git push
    # when iterating quickly on non-handler code.
    mutation:
      tags: slow
      run: just mutation-test
