# Blackjack example (Python) - deployment values for the angzarr chart

replicaCount: 1

# Use local Kind registry
imagePullSecrets: []

# =============================================================================
# Coordinator images — pinned by digest for supply-chain safety.
# =============================================================================
# The tag portion (git SHA) is advisory; container runtimes resolve by the
# @sha256 digest, so a mutated tag cannot substitute a different image.
# Applies to both CI and production deploys (both pass this file to helm).
#
# aggregate/saga/projector/processManager/gateway track core main
# (angzarr-aggregate, etc. — built with otel,postgres,amqp features).
# stream/log stay on the 2026-02-22 -dev pins — core skaffold.yaml
# doesn't build them, and they don't need the missing features.
#
# To update: docker inspect --format='{{index .RepoDigests 0}}' <image> or
#            gh api /orgs/angzarr-io/packages/container/<name>/versions
# NOTE: the aggregate/saga/projector/processManager coordinators are pinned to
# locally-built `:latest` images (loaded into kind via `just
# load-coordinators-local`), NOT the published digests. The published digests
# lagged core HEAD's `io.angzarr` proto-package + bare absolute type-URL
# refactor, so their CommandHandlerCoordinatorService returned UNIMPLEMENTED to
# clients built from the current `_gen` stubs. Rebuild from core/main with
# `just images` / the Containerfile `angzarr-*-dev` targets when core moves.
images:
  aggregate:
    repository: ghcr.io/angzarr-io/angzarr-aggregate
    tag: "latest"
    pullPolicy: IfNotPresent
  saga:
    repository: ghcr.io/angzarr-io/angzarr-saga
    tag: "latest"
    pullPolicy: IfNotPresent
  projector:
    repository: ghcr.io/angzarr-io/angzarr-projector
    tag: "latest"
    pullPolicy: IfNotPresent
  processManager:
    repository: ghcr.io/angzarr-io/angzarr-process-manager
    tag: "latest"
    pullPolicy: IfNotPresent
  stream:
    repository: ghcr.io/angzarr-io/angzarr-stream-dev
    tag: "ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:bb0bb16dc8b1039ba0cf63f38e6dbea380a389fbaae3143deaf70b4e0c38778f"
    pullPolicy: IfNotPresent
  log:
    repository: ghcr.io/angzarr-io/angzarr-log-dev
    tag: "ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:bf96d6a207d9328c3792c6d15d8a06eee2b3711b81beb74809bde41e20cfdf64"
    pullPolicy: IfNotPresent

# The component containers launch via `uv run` (uv resolves/paths the
# locked deps), which needs a writable temp dir. The chart hardens containers
# with a read-only root filesystem by default; relax it for this dev/kind
# example so uv can write its scratch under /tmp. (Deep-merged with the chart's
# securityContext defaults — only this key is overridden.)
securityContext:
  readOnlyRootFilesystem: false

storage:
  type: postgres
  postgres:
    host: "angzarr-db"
    port: 5432
    database: "angzarr"
    username: "angzarr"
    # Sensitive fields MUST be overridden at deploy time. The sentinel
    # is intentionally invalid as a password/URI — if it ever reaches a
    # running pod, the pod fails loudly on DB connect. ``just deploy-apps``
    # reads the real values from the K8s Secret ``angzarr-credentials``
    # (created by ``just seed-secrets``) and passes them via
    # ``--set-string``. No credentials live in this file under any
    # circumstance.
    password: "UNUSED_REPLACED_AT_DEPLOY"
    uri: "UNUSED_REPLACED_AT_DEPLOY"

messaging:
  type: amqp
  amqp:
    enabled: true
    host: "angzarr-mq"
    port: 5672
    # Same rule as storage.postgres: overridden at deploy time from the
    # K8s Secret. Sentinel is intentionally invalid so a missing override
    # fails the connecting pod loudly rather than silently.
    url: "UNUSED_REPLACED_AT_DEPLOY"

# The blackjack components. Each business container serves one component's
# framework service on its port; the chart pairs it with the matching
# coordinator sidecar.
applications:
  business:
    # agg-player also serves the PlayerUpcaster (UpcasterService) on its port.
    - name: agg-player
      domain: player
      port: 50401
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-player
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31320
    - name: agg-table
      domain: table
      port: 50402
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-table
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31321

  # One service per saga deployable; keep replicas at 1 (replicas of one
  # service share a queue). saga-table-player hosts the settlement, history
  # and loyalty sagas, all consuming the table domain.
  sagas:
    - name: saga-player-table
      sourceDomain: player
      domain: table
      port: 50411
      topics: ["player"]
      image:
        repository: ghcr.io/angzarr-io/examples-python-saga-player-table
        tag: latest
        pullPolicy: IfNotPresent
    - name: saga-table-player
      sourceDomain: table
      domain: player
      port: 50412
      topics: ["table"]
      image:
        repository: ghcr.io/angzarr-io/examples-python-saga-table-player
        tag: latest
        pullPolicy: IfNotPresent

  # The buy-in process: triggers from table (SeatHeld, PlayerSeated) and
  # player (FundsHeld, FundsCaptured); owns the buy-in stream.
  processManagers:
    - name: pmg-buy-in
      domain: buy-in
      port: 50421
      topics: ["table", "player"]
      image:
        repository: ghcr.io/angzarr-io/examples-python-pmg-buy-in
        tag: latest
        pullPolicy: IfNotPresent

  # The ledger projector consumes player and table and serves
  # LedgerQueryService on its port, exposed on NodePort 31325.
  projectors:
    - name: projector-player-table-ledger
      domain: ledger
      port: 50431
      topics: ["player", "table"]
      image:
        repository: ghcr.io/angzarr-io/examples-python-projector-player-table-ledger
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31325

# The coordinators call UpcasterService on each aggregate's own address:
# agg-player rewrites legacy FundsDepositedV1; agg-table has no legacy shapes
# and returns events unchanged.
upcaster:
  enabled: true

# Infrastructure settings
infrastructure:
  # The status console and the REST gateway are not part of the example.
  status:
    enabled: false
  gateway:
    enabled: false

# Resource limits for development
resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "250m"

applicationResources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "250m"
