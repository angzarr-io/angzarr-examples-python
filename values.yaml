# Python poker example - local development values

replicaCount: 1

# Use local Kind registry
imagePullSecrets: []

storage:
  type: postgres
  postgres:
    host: "angzarr-db"
    port: 5432
    database: "angzarr"
    username: "angzarr"
    # Sensitive fields MUST be overridden at deploy time. The sentinel
    # is intentionally invalid as a password/URI — if it ever reaches a
    # running pod, the pod fails loudly on DB connect. ``just deploy-apps``
    # reads the real values from the K8s Secret ``angzarr-credentials``
    # (created by ``just seed-secrets``) and passes them via
    # ``--set-string``. No credentials live in this file under any
    # circumstance.
    password: "UNUSED_REPLACED_AT_DEPLOY"
    uri: "UNUSED_REPLACED_AT_DEPLOY"

messaging:
  type: amqp
  amqp:
    enabled: true
    host: "angzarr-mq"
    port: 5672
    # Same rule as storage.postgres: overridden at deploy time from the
    # K8s Secret. Sentinel is intentionally invalid so a missing override
    # fails the connecting pod loudly rather than silently.
    url: "UNUSED_REPLACED_AT_DEPLOY"

# Poker domain aggregates
applications:
  business:
    - name: poker-player
      domain: player
      port: 50301
      image:
        repository: ghcr.io/angzarr-io/poker-python-player
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31320  # localhost:1320 via Kind port mapping

    - name: poker-table
      domain: table
      port: 50302
      image:
        repository: ghcr.io/angzarr-io/poker-python-table
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31321  # localhost:1321 via Kind port mapping

    - name: poker-hand
      domain: hand
      port: 50303
      image:
        repository: ghcr.io/angzarr-io/poker-python-hand
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31322  # localhost:1322 via Kind port mapping

    - name: poker-tournament
      domain: tournament
      port: 50304
      image:
        repository: ghcr.io/angzarr-io/poker-python-tournament
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31323

    - name: poker-reservation
      domain: reservation
      port: 50305
      image:
        repository: ghcr.io/angzarr-io/poker-python-reservation
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31324

  # Sagas — stateless event→command translators, deployed as their own pods
  # alongside an angzarr-saga sidecar that consumes from AMQP topics.
  sagas:
    - name: saga-table-hand
      domain: saga-table-hand
      port: 50411
      topics:
        - "table"  # subscribes to HandStarted from the table aggregate
      image:
        repository: ghcr.io/angzarr-io/poker-python-saga-table-hand
        tag: latest
        pullPolicy: IfNotPresent
    - name: saga-table-player
      domain: saga-table-player
      port: 50413
      topics:
        - "table"  # subscribes to HandEnded from the table aggregate
      image:
        repository: ghcr.io/angzarr-io/poker-python-saga-table-player
        tag: latest
        pullPolicy: IfNotPresent
    - name: saga-hand-table
      domain: saga-hand-table
      port: 50412
      topics:
        - "hand"  # subscribes to HandComplete -> emits EndHand on table
      image:
        repository: ghcr.io/angzarr-io/poker-python-saga-hand-table
        tag: latest
        pullPolicy: IfNotPresent
    - name: saga-hand-player
      domain: saga-hand-player
      port: 50414
      topics:
        - "hand"  # subscribes to PotAwarded -> emits DepositFunds (winner credit)
      image:
        repository: ghcr.io/angzarr-io/poker-python-saga-hand-player
        tag: latest
        pullPolicy: IfNotPresent

  # Consolidated reservation process manager — replaces the former buy-in /
  # rebuy / registration PMs. Subscribes to reservation (for lifecycle
  # events), table (for seating + chip-add confirmations), and tournament
  # (for enrollment + rebuy results); fans commands back to player
  # (ReserveFunds / DeductReservedFunds / ReleaseFunds), reservation
  # (Confirm* / Release*), table (SeatPlayer / AddRebuyChips), and
  # tournament (EnrollPlayer / ProcessRebuy). Uses QueryClient for sync
  # cross-aggregate reads (table capacity, tournament fee / phase) rather
  # than embedding destination state in the request.
  processManagers:
    - name: pmg-reservation
      domain: pmg-reservation
      port: 50395
      topics:
        - "reservation"
        - "table"
        - "tournament"
      image:
        repository: ghcr.io/angzarr-io/poker-python-pmg-reservation
        tag: latest
        pullPolicy: IfNotPresent

  # Projectors — prj-training image isn't built by `just build-images` and
  # isn't published; left empty for now since acceptance tests don't need it.
  projectors: []

# Infrastructure settings
infrastructure:
  gateway:
    enabled: true
    grpcTarget: "table-aggregate:1310"  # Points to table aggregate service
    descriptorConfigMap: "gateway-descriptor"

# Resource limits for development
resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "250m"

applicationResources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "250m"
