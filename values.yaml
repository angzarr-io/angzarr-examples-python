# Python poker example - local development values

replicaCount: 1

# Use local Kind registry
imagePullSecrets: []

# =============================================================================
# Coordinator images — pinned by digest for supply-chain safety.
# =============================================================================
# The tag portion (git SHA) is advisory; container runtimes resolve by the
# @sha256 digest, so a mutated tag cannot substitute a different image.
# Applies to both CI and production deploys (both pass this file to helm).
#
# aggregate/saga/projector/processManager/gateway track core main
# (angzarr-aggregate, etc. — built with otel,postgres,amqp features).
# stream/log stay on the 2026-02-22 -dev pins — core skaffold.yaml
# doesn't build them, and they don't need the missing features.
#
# To update: docker inspect --format='{{index .RepoDigests 0}}' <image> or
#            gh api /orgs/angzarr-io/packages/container/<name>/versions
images:
  aggregate:
    repository: ghcr.io/angzarr-io/angzarr-aggregate
    tag: "21c113f@sha256:54bd2432effec9e35ffe0b150c362c0500c1d6c0fb4bcbb9113849c108ddf7e4"
    pullPolicy: IfNotPresent
  saga:
    repository: ghcr.io/angzarr-io/angzarr-saga
    tag: "21c113f@sha256:fe4bc5bcdd252a8ebae92ac8e4faa3b6626eb22ebdd1a20c1f91b5398b01d539"
    pullPolicy: IfNotPresent
  projector:
    repository: ghcr.io/angzarr-io/angzarr-projector
    tag: "21c113f@sha256:df5c4a32cdd5855c044c52860ae2b5eec7d60599d55c46c6cecd9dba7661f66c"
    pullPolicy: IfNotPresent
  processManager:
    repository: ghcr.io/angzarr-io/angzarr-process-manager
    tag: "21c113f@sha256:bb9726f2d6ef0ea54d8ecc56c2944fa659cbcadcbe163b9782362740139f1ed4"
    pullPolicy: IfNotPresent
  stream:
    repository: ghcr.io/angzarr-io/angzarr-stream-dev
    tag: "ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:bb0bb16dc8b1039ba0cf63f38e6dbea380a389fbaae3143deaf70b4e0c38778f"
    pullPolicy: IfNotPresent
  log:
    repository: ghcr.io/angzarr-io/angzarr-log-dev
    tag: "ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:bf96d6a207d9328c3792c6d15d8a06eee2b3711b81beb74809bde41e20cfdf64"
    pullPolicy: IfNotPresent

storage:
  type: postgres
  postgres:
    host: "angzarr-db"
    port: 5432
    database: "angzarr"
    username: "angzarr"
    # Sensitive fields MUST be overridden at deploy time. The sentinel
    # is intentionally invalid as a password/URI — if it ever reaches a
    # running pod, the pod fails loudly on DB connect. ``just deploy-apps``
    # reads the real values from the K8s Secret ``angzarr-credentials``
    # (created by ``just seed-secrets``) and passes them via
    # ``--set-string``. No credentials live in this file under any
    # circumstance.
    password: "UNUSED_REPLACED_AT_DEPLOY"
    uri: "UNUSED_REPLACED_AT_DEPLOY"

messaging:
  type: amqp
  amqp:
    enabled: true
    host: "angzarr-mq"
    port: 5672
    # Same rule as storage.postgres: overridden at deploy time from the
    # K8s Secret. Sentinel is intentionally invalid so a missing override
    # fails the connecting pod loudly rather than silently.
    url: "UNUSED_REPLACED_AT_DEPLOY"

# Poker domain aggregates
applications:
  business:
    - name: poker-player
      domain: player
      port: 50301
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-player
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31320  # localhost:1320 via Kind port mapping

    - name: poker-table
      domain: table
      port: 50302
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-table
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31321  # localhost:1321 via Kind port mapping

    - name: poker-hand
      domain: hand
      port: 50303
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-hand
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31322  # localhost:1322 via Kind port mapping

    - name: poker-tournament
      domain: tournament
      port: 50304
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-tournament
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31323

    - name: poker-reservation
      domain: reservation
      port: 50305
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-reservation
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31324

  # Sagas — stateless event→command translators, deployed as their own pods
  # alongside an angzarr-saga sidecar that consumes from AMQP topics.
  sagas:
    - name: saga-table-hand
      domain: saga-table-hand
      port: 50411
      topics:
        - "table"  # subscribes to HandStarted from the table aggregate
      image:
        repository: ghcr.io/angzarr-io/examples-python-saga-table-hand
        tag: latest
        pullPolicy: IfNotPresent
    - name: saga-table-player
      domain: saga-table-player
      port: 50413
      topics:
        - "table"  # subscribes to HandEnded from the table aggregate
      image:
        repository: ghcr.io/angzarr-io/examples-python-saga-table-player
        tag: latest
        pullPolicy: IfNotPresent
    - name: saga-hand-table
      domain: saga-hand-table
      port: 50412
      topics:
        - "hand"  # subscribes to HandComplete -> emits EndHand on table
      image:
        repository: ghcr.io/angzarr-io/examples-python-saga-hand-table
        tag: latest
        pullPolicy: IfNotPresent
    - name: saga-hand-player
      domain: saga-hand-player
      port: 50414
      topics:
        - "hand"  # subscribes to PotAwarded -> emits DepositFunds (winner credit)
      image:
        repository: ghcr.io/angzarr-io/examples-python-saga-hand-player
        tag: latest
        pullPolicy: IfNotPresent

  # Consolidated reservation process manager — replaces the former buy-in /
  # rebuy / registration PMs. Subscribes to reservation (for lifecycle
  # events), table (for seating + chip-add confirmations), and tournament
  # (for enrollment + rebuy results); fans commands back to player
  # (ReserveFunds / DeductReservedFunds / ReleaseFunds), reservation
  # (Confirm* / Release*), table (SeatPlayer / AddRebuyChips), and
  # tournament (EnrollPlayer / ProcessRebuy). Uses QueryClient for sync
  # cross-aggregate reads (table capacity, tournament fee / phase) rather
  # than embedding destination state in the request.
  processManagers:
    - name: pmg-reservation
      domain: pmg-reservation
      port: 50395
      topics:
        - "reservation"
        - "table"
        - "tournament"
      image:
        repository: ghcr.io/angzarr-io/examples-python-pmg-reservation
        tag: latest
        pullPolicy: IfNotPresent

  # Projectors — prj-training image isn't built by `just build-images` and
  # isn't published; left empty for now since acceptance tests don't need it.
  projectors: []

# Infrastructure settings
infrastructure:
  gateway:
    enabled: true
    grpcTarget: "table-aggregate:1310"  # Points to table aggregate service
    descriptorConfigMap: "gateway-descriptor"
    # Pinned by digest; see comment on top-level `images:` for rationale.
    image:
      repository: ghcr.io/angzarr-io/angzarr-grpc-gateway
      tag: "21c113f@sha256:ac5f95d76dcd1d6b504d5c654d75b3340757872c8a092955d6f29230547f4ffb"
      pullPolicy: IfNotPresent

# Resource limits for development
resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "250m"

applicationResources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "250m"
