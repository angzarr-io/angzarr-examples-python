# Python poker example - local development values

replicaCount: 1

# Use local Kind registry
imagePullSecrets: []

# =============================================================================
# Coordinator images — pinned by digest for supply-chain safety.
# =============================================================================
# The tag portion (git SHA) is advisory; container runtimes resolve by the
# @sha256 digest, so a mutated tag cannot substitute a different image.
# Applies to both CI and production deploys (both pass this file to helm).
#
# aggregate/saga/projector/processManager/gateway track core main
# (angzarr-aggregate, etc. — built with otel,postgres,amqp features).
# stream/log stay on the 2026-02-22 -dev pins — core skaffold.yaml
# doesn't build them, and they don't need the missing features.
#
# To update: docker inspect --format='{{index .RepoDigests 0}}' <image> or
#            gh api /orgs/angzarr-io/packages/container/<name>/versions
# NOTE: the aggregate/saga/projector/processManager coordinators are pinned to
# locally-built `:latest` images (loaded into kind via `just
# load-coordinators-local`), NOT the published digests. The published digests
# lagged core HEAD's `io.angzarr` proto-package + bare absolute type-URL
# refactor, so their CommandHandlerCoordinatorService returned UNIMPLEMENTED to
# clients built from the current `_gen` stubs. Rebuild from core/main with
# `just images` / the Containerfile `angzarr-*-dev` targets when core moves.
images:
  aggregate:
    repository: ghcr.io/angzarr-io/angzarr-aggregate
    tag: "latest"
    pullPolicy: IfNotPresent
  saga:
    repository: ghcr.io/angzarr-io/angzarr-saga
    tag: "latest"
    pullPolicy: IfNotPresent
  projector:
    repository: ghcr.io/angzarr-io/angzarr-projector
    tag: "latest"
    pullPolicy: IfNotPresent
  processManager:
    repository: ghcr.io/angzarr-io/angzarr-process-manager
    tag: "latest"
    pullPolicy: IfNotPresent
  stream:
    repository: ghcr.io/angzarr-io/angzarr-stream-dev
    tag: "ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:bb0bb16dc8b1039ba0cf63f38e6dbea380a389fbaae3143deaf70b4e0c38778f"
    pullPolicy: IfNotPresent
  log:
    repository: ghcr.io/angzarr-io/angzarr-log-dev
    tag: "ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:bf96d6a207d9328c3792c6d15d8a06eee2b3711b81beb74809bde41e20cfdf64"
    pullPolicy: IfNotPresent

storage:
  type: postgres
  postgres:
    host: "angzarr-db"
    port: 5432
    database: "angzarr"
    username: "angzarr"
    # Sensitive fields MUST be overridden at deploy time. The sentinel
    # is intentionally invalid as a password/URI — if it ever reaches a
    # running pod, the pod fails loudly on DB connect. ``just deploy-apps``
    # reads the real values from the K8s Secret ``angzarr-credentials``
    # (created by ``just seed-secrets``) and passes them via
    # ``--set-string``. No credentials live in this file under any
    # circumstance.
    password: "UNUSED_REPLACED_AT_DEPLOY"
    uri: "UNUSED_REPLACED_AT_DEPLOY"

messaging:
  type: amqp
  amqp:
    enabled: true
    host: "angzarr-mq"
    port: 5672
    # Same rule as storage.postgres: overridden at deploy time from the
    # K8s Secret. Sentinel is intentionally invalid so a missing override
    # fails the connecting pod loudly rather than silently.
    url: "UNUSED_REPLACED_AT_DEPLOY"

# Poker domain aggregates
applications:
  business:
    - name: poker-player
      domain: player
      port: 50301
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-player
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31320  # localhost:1320 via Kind port mapping

    - name: poker-table
      domain: table
      port: 50302
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-table
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31321  # localhost:1321 via Kind port mapping

    - name: poker-hand
      domain: hand
      port: 50303
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-hand
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31322  # localhost:1322 via Kind port mapping

    - name: poker-tournament
      domain: tournament
      port: 50304
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-tournament
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31323

    - name: poker-reservation
      domain: reservation
      port: 50305
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-reservation
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31324

  # Sagas — ONE app hosting every poker saga (sagas/main.py registers all six;
  # the core routes each source event by its cover domain to the saga(s) that
  # consume it). The saga coordinator subscribes to ALL events (SubscriberAll,
  # queue `saga-saga`) and the in-process router filters by source domain, so a
  # SINGLE app covers table/hand/tournament sources. Running one app per source
  # domain would NOT fan-out usefully — each pod gets every event anyway, so
  # three pods would each emit the same command (e.g. duplicate DealCards).
  # Multiple DISTINCT saga services (not replicas of one) would each get their
  # own queue; that is the real fan-out. Events with no registered saga (e.g.
  # player) are ACK-skipped by the servicer rather than NACK+requeued.
  sagas:
    - name: poker-saga
      domain: saga
      port: 50410
      topics:
        - "table"   # advisory only; SubscriberAll ignores it and binds all
      image:
        repository: ghcr.io/angzarr-io/examples-python-saga
        tag: latest
        pullPolicy: IfNotPresent

  # Process managers — ONE consolidated image (examples-python-pmg) hosts both
  # poker PMs (hand_flow + reservation; process_managers/main.py registers
  # both). The PM coordinator supports multiple source domains per app (chart
  # maps `.topics | join ","` → ANGZARR__MESSAGING__AMQP__DOMAIN and emits
  # ANGZARR_SUBSCRIPTIONS), so a single app binds every source the two PMs
  # consume. The core routes each trigger to every co-resident PM that
  # consumes its domain (see commit "route triggers to co-resident PMs").
  processManagers:
    - name: poker-pmg
      domain: pmg
      port: 50395
      topics:
        - "reservation"  # reservation PM lifecycle events
        - "table"        # seating + chip-add confirmations; hand-flow table events
        - "tournament"   # enrollment + rebuy results
        - "hand"         # hand-flow lifecycle triggers
      image:
        repository: ghcr.io/angzarr-io/examples-python-pmg
        tag: latest
        pullPolicy: IfNotPresent

  # Projectors — OutputProjector (read-model renderer). The coordinator binds
  # a single source domain (`.topics | first`); the rendered read model lives
  # in the handler's in-process sink (no external query surface yet — the
  # cluster projector-consistency scenario EA-0004 stays @wip). Deployed bound
  # to `hand` so it renders the hand lifecycle that the smoke path produces.
  projectors:
    - name: output
      domain: hand
      port: 50491
      topics:
        - "hand"
      image:
        repository: ghcr.io/angzarr-io/examples-python-projector
        tag: latest
        pullPolicy: IfNotPresent

# Infrastructure settings
infrastructure:
  # The status console (angzarr-status) isn't part of the poker example and its
  # image isn't built/loaded here — leaving it on makes the pod ImagePullBackOff
  # and `helm --wait` time out (the deploy reports failure though every poker
  # component is healthy). Disabled so `just up` / `deploy-apps` succeed cleanly.
  status:
    enabled: false
  gateway:
    enabled: true
    grpcTarget: "table-aggregate:1310"  # Points to table aggregate service
    descriptorConfigMap: "gateway-descriptor"
    # Pinned by digest; see comment on top-level `images:` for rationale.
    image:
      repository: ghcr.io/angzarr-io/angzarr-grpc-gateway
      tag: "b98e8de@sha256:87bda37983c8ebafe59d1b7e5b436962e67fae93b28cbcba4950c641620c8b30"
      pullPolicy: IfNotPresent

# Resource limits for development
resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "250m"

applicationResources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "250m"
