# Python poker example - local development values

replicaCount: 1

# Use local Kind registry
imagePullSecrets: []

# =============================================================================
# Coordinator images — pinned by digest for supply-chain safety.
# =============================================================================
# The tag portion (git SHA) is advisory; container runtimes resolve by the
# @sha256 digest, so a mutated tag cannot substitute a different image.
# Applies to both CI and production deploys (both pass this file to helm).
#
# aggregate/saga/projector/processManager/gateway track core main
# (angzarr-aggregate, etc. — built with otel,postgres,amqp features).
# stream/log stay on the 2026-02-22 -dev pins — core skaffold.yaml
# doesn't build them, and they don't need the missing features.
#
# To update: docker inspect --format='{{index .RepoDigests 0}}' <image> or
#            gh api /orgs/angzarr-io/packages/container/<name>/versions
# NOTE: the aggregate/saga/projector/processManager coordinators are pinned to
# locally-built `:latest` images (loaded into kind via `just
# load-coordinators-local`), NOT the published digests. The published digests
# lagged core HEAD's `io.angzarr` proto-package + bare absolute type-URL
# refactor, so their CommandHandlerCoordinatorService returned UNIMPLEMENTED to
# clients built from the current `_gen` stubs. Rebuild from core/main with
# `just images` / the Containerfile `angzarr-*-dev` targets when core moves.
images:
  aggregate:
    repository: ghcr.io/angzarr-io/angzarr-aggregate
    tag: "latest"
    pullPolicy: IfNotPresent
  saga:
    repository: ghcr.io/angzarr-io/angzarr-saga
    tag: "latest"
    pullPolicy: IfNotPresent
  projector:
    repository: ghcr.io/angzarr-io/angzarr-projector
    tag: "latest"
    pullPolicy: IfNotPresent
  processManager:
    repository: ghcr.io/angzarr-io/angzarr-process-manager
    tag: "latest"
    pullPolicy: IfNotPresent
  stream:
    repository: ghcr.io/angzarr-io/angzarr-stream-dev
    tag: "ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:bb0bb16dc8b1039ba0cf63f38e6dbea380a389fbaae3143deaf70b4e0c38778f"
    pullPolicy: IfNotPresent
  log:
    repository: ghcr.io/angzarr-io/angzarr-log-dev
    tag: "ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:bf96d6a207d9328c3792c6d15d8a06eee2b3711b81beb74809bde41e20cfdf64"
    pullPolicy: IfNotPresent

# The poker component containers launch via `uv run` (uv resolves/paths the
# locked deps), which needs a writable temp dir. The chart hardens containers
# with a read-only root filesystem by default; relax it for this dev/kind
# example so uv can write its scratch under /tmp. (Deep-merged with the chart's
# securityContext defaults — only this key is overridden.)
securityContext:
  readOnlyRootFilesystem: false

storage:
  type: postgres
  postgres:
    host: "angzarr-db"
    port: 5432
    database: "angzarr"
    username: "angzarr"
    # Sensitive fields MUST be overridden at deploy time. The sentinel
    # is intentionally invalid as a password/URI — if it ever reaches a
    # running pod, the pod fails loudly on DB connect. ``just deploy-apps``
    # reads the real values from the K8s Secret ``angzarr-credentials``
    # (created by ``just seed-secrets``) and passes them via
    # ``--set-string``. No credentials live in this file under any
    # circumstance.
    password: "UNUSED_REPLACED_AT_DEPLOY"
    uri: "UNUSED_REPLACED_AT_DEPLOY"

messaging:
  type: amqp
  amqp:
    enabled: true
    host: "angzarr-mq"
    port: 5672
    # Same rule as storage.postgres: overridden at deploy time from the
    # K8s Secret. Sentinel is intentionally invalid so a missing override
    # fails the connecting pod loudly rather than silently.
    url: "UNUSED_REPLACED_AT_DEPLOY"

# Poker domain aggregates
applications:
  business:
    - name: poker-player
      domain: player
      port: 50301
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-player
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31320  # localhost:1320 via Kind port mapping

    - name: poker-table
      domain: table
      port: 50302
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-table
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31321  # localhost:1321 via Kind port mapping

    - name: poker-hand
      domain: hand
      port: 50303
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-hand
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31322  # localhost:1322 via Kind port mapping

    - name: poker-tournament
      domain: tournament
      port: 50304
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-tournament
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31323

    - name: poker-reservation
      domain: reservation
      port: 50305
      image:
        repository: ghcr.io/angzarr-io/examples-python-agg-reservation
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31324

  # Sagas — ONE service PER saga (no consolidated host). Each saga runs its own
  # coordinator + business container (replicas=1), owned by its source (input)
  # domain. The saga coordinator subscribes to ALL events (SubscriberAll); each
  # DISTINCT service gets its own queue, so every saga sees every event and the
  # in-process router handles only its own source domain — events it does not
  # consume are ACK-skipped by the servicer (not NACK+requeued). Keep replicas=1
  # per saga: replicas of ONE service share a queue and would duplicate commands.
  sagas:
    - name: saga-table-hand
      domain: table-hand
      port: 50411
      topics: ["table-hand"]   # advisory; SubscriberAll binds all
      image:
        repository: ghcr.io/angzarr-io/examples-python-saga-table-hand
        tag: latest
        pullPolicy: IfNotPresent
    - name: saga-table-player
      domain: table-player
      port: 50412
      topics: ["table-player"]
      image:
        repository: ghcr.io/angzarr-io/examples-python-saga-table-player
        tag: latest
        pullPolicy: IfNotPresent
    - name: saga-table-tournament
      domain: table-tournament
      port: 50413
      topics: ["table-tournament"]
      image:
        repository: ghcr.io/angzarr-io/examples-python-saga-table-tournament
        tag: latest
        pullPolicy: IfNotPresent
    - name: saga-hand-table
      domain: hand-table
      port: 50414
      topics: ["hand-table"]
      image:
        repository: ghcr.io/angzarr-io/examples-python-saga-hand-table
        tag: latest
        pullPolicy: IfNotPresent
    - name: saga-hand-player
      domain: hand-player
      port: 50415
      topics: ["hand-player"]
      image:
        repository: ghcr.io/angzarr-io/examples-python-saga-hand-player
        tag: latest
        pullPolicy: IfNotPresent
    - name: saga-tournament-table
      domain: tournament-table
      port: 50416
      topics: ["tournament-table"]
      image:
        repository: ghcr.io/angzarr-io/examples-python-saga-tournament-table
        tag: latest
        pullPolicy: IfNotPresent

  # Process managers — ONE service PER PM (no consolidated host), owned by its
  # source domain. hand_flow consumes table/tournament/hand triggers; reservation
  # consumes the reservation lifecycle. Each runs its own coordinator (replicas=1)
  # and ACK-skips triggers it does not consume.
  processManagers:
    - name: pmg-hand-flow
      domain: hand
      port: 50395
      topics:
        - "table"        # seating + chip-add confirmations; hand-flow table events
        - "tournament"   # enrollment + rebuy results
        - "hand"         # hand-flow lifecycle triggers
      image:
        repository: ghcr.io/angzarr-io/examples-python-pmg-hand-flow
        tag: latest
        pullPolicy: IfNotPresent
    - name: pmg-reservation
      domain: reservation
      port: 50396
      topics:
        - "reservation"  # reservation PM lifecycle events
      image:
        repository: ghcr.io/angzarr-io/examples-python-pmg-reservation
        tag: latest
        pullPolicy: IfNotPresent

  # Projectors — per-domain read models. Each coordinator binds a single source
  # domain (`.topics | first`).
  #
  # `output` is the auxiliary cross-domain OutputProjector narrator: it renders
  # the hand lifecycle into an in-process display sink (presentation, no query
  # surface) and is deployed bound to `hand` for the smoke path.
  #
  # `player` is the PlayerProjector: it folds player-domain funds events into a
  # bankroll read model AND serves PlayerProjectionQueryService on its own gRPC
  # port, so a client can observe read-model eventual consistency from outside
  # the write side. Exposed via a debug NodePort (31325) so the cluster
  # acceptance harness can query it (EA-0004).
  projectors:
    - name: output
      domain: hand
      port: 50491
      topics:
        - "hand"
      image:
        repository: ghcr.io/angzarr-io/examples-python-projector-output
        tag: latest
        pullPolicy: IfNotPresent
    - name: player
      domain: player
      port: 50492
      topics:
        - "player"
      image:
        repository: ghcr.io/angzarr-io/examples-python-projector-player
        tag: latest
        pullPolicy: IfNotPresent
      debug:
        enabled: true
        nodePort: 31325

# Infrastructure settings
infrastructure:
  # The status console (angzarr-status) isn't part of the poker example and its
  # image isn't built/loaded here — leaving it on makes the pod ImagePullBackOff
  # and `helm --wait` time out (the deploy reports failure though every poker
  # component is healthy). Disabled so `just up` / `deploy-apps` succeed cleanly.
  status:
    enabled: false
  gateway:
    enabled: true
    grpcTarget: "table-aggregate:1310"  # Points to table aggregate service
    descriptorConfigMap: "gateway-descriptor"
    # Pinned by digest; see comment on top-level `images:` for rationale.
    image:
      repository: ghcr.io/angzarr-io/angzarr-grpc-gateway
      tag: "b98e8de@sha256:87bda37983c8ebafe59d1b7e5b436962e67fae93b28cbcba4950c641620c8b30"
      pullPolicy: IfNotPresent

# Resource limits for development
resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "250m"

applicationResources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "250m"
